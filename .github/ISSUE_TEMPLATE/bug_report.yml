name: Bug report
description: Report something broken or unexpected in SQLTalk.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug — reports like these genuinely improve the project.

        ⚠️ **Never paste API keys, connection strings, or passwords here.** Sanitize all logs and config snippets before submitting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: dialect
    attributes:
      label: Database dialect
      options:
        - mssql (SQL Server, local)
        - postgres (Neon demo)
        - Not applicable
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system / hosting
      placeholder: Windows 11 local, or Streamlit Community Cloud
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (sanitized)
      description: Error messages or logs, with all secrets redacted.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I have redacted all API keys, connection strings, and passwords.
          required: true
        - label: I have searched existing issues for a duplicate.
          required: true
